[project]
name = "wine-quality-mlops"
version = "0.1.0"
description = "Production-ready ML pipeline for wine quality classification using MLflow and scikit-learn"
readme = "README.md"
authors = [
    { name = "KeanuJeeves", email = "tomislav.suhina@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "mlflow>=2.9.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "joblib>=1.3.0",
    "optuna>=4.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "evidently>=0.7.15",
    "pip>=24.0", # Explicitly specify pip version to avoid MLflow warning
]

[project.scripts]
wine-quality = "wine_quality_mlops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
